<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gallery button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&family=Atkinson+Hyperlegible:wght@700&family=Spline+Sans+Mono:wght@700&display=swap">
<style>
/* Rendered to docs/gallery-button.png by make_button.mjs. The donate button's shape, in butter yellow with the cutify face. */
:root { --ink: #1f2430; --soft: #4a5260; }
html, body { margin: 0; background: transparent; }
#shot { display: inline-block; padding: 6px 12px 14px 6px; }
.btn { display: inline-flex; align-items: center; gap: 14px; padding: 12px 26px 12px 18px; border: 2px solid var(--ink); border-radius: 999px;
  background: #ffe28a; color: var(--ink); box-shadow: 0 5px 0 var(--ink); }
.heart { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border: 2px solid var(--ink); border-radius: 50%; background: #fff; }
.text { display: grid; gap: 3px; }
.label { font: 600 24px/1.05 'Pixelify Sans', sans-serif; white-space: nowrap; }
.spark { flex: none; margin: 0 -4px 0 -2px; }
.sub { display: flex; align-items: center; gap: 7px; font: 700 11.5px/1 'Spline Sans Mono', monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); white-space: nowrap; }
.tag { padding: 3px 8px 2px; border-radius: 999px; background: #1f2430; color: #ffe28a; text-transform: none; letter-spacing: .02em; }
.arrow { flex: none; margin-left: 2px; }
</style>
</head>
<body>
<div id="shot"><span class="btn">
  <span class="heart"><svg viewBox="0 0 16 16" width="30" height="30" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="2" width="12" height="12" fill="#16171a"/><rect x="3" y="3" width="10" height="10" fill="#ffb3c7"/><rect x="5" y="6" width="2" height="2" fill="#16171a"/><rect x="9" y="6" width="2" height="2" fill="#16171a"/><rect x="4" y="8" width="1" height="1" fill="#ff8fab"/><rect x="11" y="8" width="1" height="1" fill="#ff8fab"/><rect x="5" y="9" width="1" height="1" fill="#16171a"/><rect x="10" y="9" width="1" height="1" fill="#16171a"/><rect x="6" y="10" width="4" height="1" fill="#16171a"/></svg></span>
  <span class="text"><span class="label">Open the live gallery</span><span class="sub">See them move at <span class="tag">cutify.ghernie.com</span></span></span>
  <svg class="spark" viewBox="0 0 9 9" width="22" height="22" shape-rendering="crispEdges" aria-hidden="true"><path fill="#ff5c8a" d="M4 0h1v3H4zM4 6h1v3H4zM0 4h3v1H0zM6 4h3v1H6zM3 3h3v3H3z"/></svg>
  <svg class="arrow" viewBox="0 0 8 8" width="20" height="20" shape-rendering="crispEdges" aria-hidden="true"><path fill="#1f2430" d="M4 1h1v6H4zM5 2h1v4H5zM6 3h1v2H6zM0 3h4v2H0z"/></svg>
</span></div>
</body>
</html>
