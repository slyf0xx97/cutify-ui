<!doctype html>
<!-- The animated README cover: the social card's left column beside three live examples. Recorded by make_gif.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
:root { --paper: #fbf7ee; --rule: #e6dcc8; --ink: #1f2430; --soft: #4a5260; --pink: #ffb3c7; --butter: #ffe28a; --mint: #b8ecd3; --sky: #bfe3ff; --lilac: #d9c8ff; }
* { box-sizing: border-box; }
html, body { margin: 0; }
.card { position: relative; width: 1280px; height: 640px; overflow: hidden; color: var(--ink); font-family: 'Atkinson Hyperlegible', sans-serif;
  background: repeating-linear-gradient(0deg, transparent 0 27px, var(--rule) 27px 28px), repeating-linear-gradient(90deg, transparent 0 27px, #efe6d4 27px 28px), var(--paper); }
.left { position: absolute; left: 64px; top: 92px; width: 610px; }
.tape { display: inline-block; padding: 6px 16px; background: var(--butter); border: 3px solid var(--ink); transform: rotate(-2deg);
  font: 700 20px 'Spline Sans Mono', monospace; letter-spacing: .04em; }
.brand { display: flex; align-items: center; gap: 20px; margin: 26px 0 18px; }
.brand svg { width: 84px; height: 84px; flex: none; }
h1 { margin: 0; font: 600 92px/1 'Pixelify Sans', sans-serif; white-space: nowrap; }
h1 span { background: linear-gradient(transparent 58%, var(--pink) 58%, var(--pink) 92%, transparent 92%); padding: 0 .08em; }
p { margin: 0 0 24px; font-size: 28px; line-height: 1.35; color: var(--ink); }
.cmd { display: inline-block; padding: 12px 18px; background: var(--ink); color: var(--paper); border-radius: 12px; font: 500 15px 'Spline Sans Mono', monospace; white-space: nowrap; box-shadow: 6px 7px 0 var(--pink); }
.cmd b { color: var(--pink); font-weight: 500; }
.chips { display: flex; gap: 10px; margin-top: 24px; }
.chips span { padding: 5px 13px; border: 2px solid var(--ink); border-radius: 999px; font: 700 17px 'Spline Sans Mono', monospace; background: #fff; }
.shot { position: absolute; width: 470px; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 8px 9px 0 var(--ink); }
.shot iframe { display: block; border: 0; transform-origin: 0 0; pointer-events: none; }
.big { width: 540px; height: 338px; }
/* zoom the Sprout tile in on its window-sill scene, where the plant gets watered */
.big iframe { width: 1280px; height: 800px; transform: scale(.86) translate(-632px, -104px); }
.small { width: 262px; height: 164px; } .small iframe { width: 1280px; height: 800px; transform: scale(.2047); }
.tag { position: absolute; left: 8px; bottom: 8px; padding: 2px 9px; border: 2px solid var(--ink); border-radius: 999px; background: #fffdf7; font: 700 12px 'Spline Sans Mono', monospace; }
.pin { position: absolute; top: -12px; left: 50%; width: 24px; height: 24px; margin-left: -12px; border: 3px solid var(--ink); border-radius: 50%; z-index: 2; }
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <span class="tape">A free Claude skill, MIT</span>
    <div class="brand">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="2" width="12" height="12" fill="#16171a"/><rect x="3" y="3" width="10" height="10" fill="#ffb3c7"/><rect x="5" y="6" width="2" height="2" fill="#16171a"/><rect x="9" y="6" width="2" height="2" fill="#16171a"/><rect x="4" y="8" width="1" height="1" fill="#ff8fab"/><rect x="11" y="8" width="1" height="1" fill="#ff8fab"/><rect x="5" y="9" width="1" height="1" fill="#16171a"/><rect x="10" y="9" width="1" height="1" fill="#16171a"/><rect x="6" y="10" width="4" height="1" fill="#16171a"/></svg>
      <h1>cutify<span>-ui</span></h1>
    </div>
    <p>Claude builds cute, game-like web pages with pixel characters, story stages and motion. Six themes, React or plain HTML.</p>
    <span class="cmd"><b>/plugin install</b> cutify-ui --marketplace slyf0xx97/cutify-ui</span>
    <div class="chips"><span>Glass</span><span>Picnic</span><span>Riso</span><span>Toy Box</span><span>+2</span></div>
  </div>
  <div class="shot big" style="left: 690px; top: 34px; transform: rotate(-1.5deg); z-index: 2"><span class="pin" style="background: var(--mint)"></span><iframe src="../examples/sprout/" title="Sprout" tabindex="-1"></iframe><span class="tag">Glass</span></div>
  <div class="shot small" style="left: 676px; top: 382px; transform: rotate(2deg); z-index: 3"><span class="pin" style="background: var(--butter)"></span><iframe src="../examples/moonlit-market/" title="Moonlit Market" tabindex="-1"></iframe><span class="tag">Lantern Night</span></div>
  <div class="shot small" style="left: 958px; top: 392px; transform: rotate(-2deg); z-index: 3"><span class="pin" style="background: var(--sky)"></span><iframe src="../examples/beep-and-build/" title="Beep and Build" tabindex="-1"></iframe><span class="tag">Toy Box</span></div>
</div>
</body>
</html>
