# Keeps the dev tools in tools/ and the GitHub Actions versions current. The skill itself has no dependencies.
version: 2
updates:
  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: monthly
    groups:
      dev-tools:
        patterns: ["*"]
    ignore:
      # TypeScript 7 has no JavaScript API, which tools/react-test.mjs uses to load the components
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
