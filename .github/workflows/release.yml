name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # attach the skill zip to the release
      id-token: write       # sign the provenance attestation
      attestations: write   # store the attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python tools/package_skill.py
      - name: Attach the skill zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/cutify-ui.zip --clobber || gh release create "$GITHUB_REF_NAME" dist/cutify-ui.zip --generate-notes
      - name: Attest where the zip was built
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/cutify-ui.zip
      - name: Attach the attestation to the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" dist/cutify-ui.zip.intoto.jsonl
          gh release upload "$GITHUB_REF_NAME" dist/cutify-ui.zip.intoto.jsonl --clobber
