name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm install --no-audit --no-fund
        working-directory: tools
      - run: npm run check
        working-directory: tools
      - name: Validate the Claude Code plugin
        run: npx -y @anthropic-ai/claude-code plugin validate --strict . && npx -y @anthropic-ai/claude-code plugin validate --strict ./plugin
