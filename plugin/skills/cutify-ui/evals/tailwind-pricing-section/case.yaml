schema_version: "1.1"
name: tailwind-pricing-section
expected_outcome: |
  An index.html with only a pricing section, and a Tailwind v4 input CSS file that imports Tailwind, brings in a Picnic theme and maps its tokens with @theme. Utilities handle layout, the theme supplies the look, with pixel-art, reduced-motion handling and no default Tailwind purple gradients.
